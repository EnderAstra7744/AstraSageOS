# AstraSageOS - GNU GRUB configuration (real GRUB 2; AstraSageOS is its own Multiboot-1 kernel, not Linux).
# Boot chain:  BIOS/UEFI -> GRUB (this menu) -> `multiboot /boot/as_kernel.elf` -> as_kernel -> AST / desktop.
#
# Countdown: change `timeout` (seconds; -1 = wait for ever). Any key during the countdown stops it,
# then the choice is made with the arrow keys and Enter.

set default=0
set timeout=10
set timeout_style=menu

insmod part_msdos
insmod part_gpt
insmod iso9660
insmod gzio

# graphics: only the one video driver the platform needs (all_video probes every driver = slow)
if [ "$grub_platform" = "pc" ]; then
    insmod vbe
else
    insmod efi_gop
fi
insmod gfxterm
insmod png
insmod gfxmenu
insmod multiboot
insmod reboot
insmod halt
insmod lsmmap
insmod cpuid
insmod read
set gfxmode=1920x1080x32,1280x720x32,1024x768x32,auto
if loadfont /boot/grub/fonts/unicode.pf2; then
    terminal_output gfxterm
fi

# The opening banner ("Welcome To AstraSageOS" then "Welcome To GNU/GRUB", green on the black BIOS text screen) is printed
# by GRUB itself (patched grub-core/kern/main.c); the menu follows after the screen is cleared.
set color_normal=white/black
set color_highlight=white/black
clear

# 32-bit or 64-bit: decided automatically. A 64-bit CPU (GRUB's `cpuid -l`) starts the 64-bit kernel, anything else the 32-bit one.
# Nothing is asked; the other kernel can still be picked from the menu ("Start AstraSageOS ..." entries).
if [ -f /boot/as_kernel_x64.elf ]; then
    if cpuid -l; then
        set default=astrasage64
    fi
fi

set theme=/boot/grub/themes/astrasage/theme.txt
export theme

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-green

# 1. default entry: starts AstraSageOS with its own boot mechanism
menuentry "Start AstraSageOS" --id astrasage {
    multiboot /boot/as_kernel.elf gui
    boot
}

# 1b. the experimental 64-bit (x86_64) kernel - only offered if it is on this CD; needs a 64-bit CPU
if [ -f /boot/as_kernel_x64.elf ]; then
    menuentry "Start AstraSageOS 64-bit (x86_64, experimental)" --id astrasage64 {
        multiboot /boot/as_kernel_x64.elf gui
        boot
    }
fi

# 2. alternative ways to start the same kernel (only options the kernel really has: `gui`, `text`)
submenu "Advanced Boot Options" --id advanced {
    menuentry "AstraSageOS - graphical desktop (forced)" --id advanced-gui {
        multiboot /boot/as_kernel.elf gui
        boot
    }
    if [ "$grub_platform" = "pc" ]; then
        menuentry "AstraSageOS - AST terminal only (text mode)" --id advanced-text {
            multiboot /boot/as_kernel.elf text
            set gfxpayload=text
            boot
        }
    fi
    menuentry "AstraSageOS - no kernel option (automatic: text if a serial terminal exists)" --id advanced-auto {
        multiboot /boot/as_kernel.elf
        boot
    }
}

# 3. recovery: AstraSageOS has no repair tool or separate recovery kernel. What really exists is the text-mode
#    AST terminal without the graphical desktop (files and commands only), so that is what is offered, named honestly.
if [ "$grub_platform" = "pc" ]; then
    submenu "Recovery Mode" --id recovery {
        menuentry "AST terminal (text mode, no graphical desktop - not a repair tool)" --id recovery-text {
            multiboot /boot/as_kernel.elf text
            set gfxpayload=text
            boot
        }
    }
else
    # UEFI has no VGA text mode, so the text-only terminal cannot be shown there: say so instead of pretending.
    menuentry "Recovery Mode (not available on UEFI)" --id recovery {
        clear
        echo "The AstraSageOS recovery option is the text-mode AST terminal."
        echo "UEFI has no text mode, so it cannot be offered on this platform."
        echo "Start the computer in BIOS (legacy/CSM) mode to use it."
        echo
        echo "Press Enter to return to the menu."
        read dummy
    }
fi

# 4. system information from what GRUB itself knows about the boot environment
menuentry "System Information" --id sysinfo {
    clear
    echo "AstraSageOS - Boot environment"
    echo
    echo "GRUB version       : 2.12 (GNU GRUB)"
    echo "Platform           : $grub_cpu-$grub_platform"
    echo "Boot device        : $root"
    echo "GRUB directory     : $prefix"
    if [ -f /boot/as_kernel.elf ]; then
        echo "Kernel             : /boot/as_kernel.elf (Multiboot 1, i386) found"
    else
        echo "Kernel             : /boot/as_kernel.elf NOT FOUND"
    fi
    if [ "$grub_cpu" = "i386" -o "$grub_cpu" = "x86_64" ]; then
        if cpuid -l; then
            echo "Processor          : 64-bit (long mode) supported"
        else
            echo "Processor          : no 64-bit support / unknown"
        fi
    fi
    echo
    echo "--- Memory map ---"
    lsmmap
    echo
    echo "--- Devices ---"
    ls
    echo
    echo "Press Enter to return to the menu."
    read dummy
}

# 5. restart
menuentry "Restart" --id reboot {
    reboot
}

# 6. power off (`halt` works with ACPI on PC BIOS and through the firmware on UEFI; some machines and
#    emulator settings do not allow it - then GRUB comes back and says so)
menuentry "Power Off" --id poweroff {
    halt
    echo "This environment cannot power off from GRUB. Turn the power off by hand or return to the menu."
    echo "Press Enter to return to the menu."
    read dummy
}
